name: Temp check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node .tmpcheck/check.mjs
        env:
          FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
