<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Nap Log</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#4f46e5;--ok:#16a34a;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--ac:#818cf8;--ok:#4ade80;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:520px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
h1{font-size:20px;margin:6px 0}h2{font-size:15px;margin:0 0 8px;color:var(--mu);font-weight:600}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.x{background:transparent;color:var(--mu);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}
.big{font-size:32px;font-weight:700}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:13px;color:var(--mu)}
.tap{cursor:pointer}
.lnk{background:transparent;color:var(--ac);padding:8px 0 0}
button.x.del{color:#dc2626}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(92vw,400px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin:8px 0}
.tabs button{flex:1;background:transparent;color:var(--mu);padding:8px}
.tabs button.on{background:var(--ac);color:#fff}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calhead button{font-size:22px;padding:2px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--mu);padding:2px 0}
.cal button{position:relative;min-height:40px;padding:8px 0;background:transparent;color:var(--tx);border-radius:10px}
.cal button.today{outline:1.5px solid var(--ac);outline-offset:-1.5px}
.cal button.sel{background:var(--ac);color:#fff}
.cal button.dot::after{content:'';position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.cal button.sel.dot::after{background:#fff}
.lnk{margin-right:16px}
</style></head>
<body>
<h1>😴 Nap Log <span class="mu" id="sync"></span></h1>
<div class="tabs"><button id="t-today" class="on" onclick="setTab('today')">Today</button><button id="t-hist" onclick="setTab('hist')">History</button></div>

<div id="v-today">
<div class="card" id="now"></div>
<div class="card"><h2>Today's plan</h2><div id="plan"></div><button class="lnk" onclick="openAdd('nap')">＋ Add extra nap</button></div>
<div class="card"><h2>Settings</h2>
 <div class="grid">
  <div><label>Target naps/day</label><input type="number" id="sn" min="1" max="8"></div>
  <div><label>Target bedtime</label><input type="time" id="sb"></div>
 </div>
 <p><label>Family code (same on both phones)</label><input id="sf" placeholder="a long random phrase"></p>
 <button id="ssave">Save</button>
</div>
</div>

<div id="v-hist" hidden>
<div class="card" id="cal"></div>
<div class="card" id="day"></div>
</div>

<dialog id="dlg">
 <h2 id="dt"></h2>
 <div class="grid">
  <div><label>Start</label><input type="time" id="es"></div>
  <div><label>End</label><input type="time" id="ee"></div>
 </div>
 <p><button id="esave">Save</button> <button class="x" id="ecancel">Cancel</button> <button class="x del" id="edel">Delete</button></p>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Paste your Firebase web config here to enable sharing between phones.
// Leave as null to run in local-only mode (data stays on this phone).
const FIREBASE_CONFIG = null;

const $=s=>document.querySelector(s);
const DAY=864e5,P=n=>String(n).padStart(2,'0');
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let settings=load('nt_settings',{targetNaps:4,bedtime:'19:30'}),entries=load('nt_entries',[]),family=load('nt_family',''),db=null,unsubs=[];

const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return +d};
const tod=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const hm=m=>{m=Math.round(m);return P(Math.floor(m/60)%24)+':'+P(m%60)};
const dur=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+P(m%60)+'m':m+'m'};
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isoDay=t=>{const d=new Date(t);return d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate())};
// history tab state; `hist` holds entries older than the live 14-day sync window (shared mode only)
let hist={},tab='today',viewM=new Date(new Date().getFullYear(),new Date().getMonth(),1),selDay=sod(Date.now());
const allE=()=>{const m={};Object.values(hist).forEach(e=>m[e.id]=e);entries.forEach(e=>m[e.id]=e);return Object.values(m)};
const findE=id=>entries.find(x=>x.id===id)||hist[id];

// ---------- storage / sync ----------
const fam=()=>db.collection('families').doc(family);
function putEntry(e){
  if(db){
    fam().collection('entries').doc(e.id).set(e);
    if(e.start<sod(Date.now())-14*DAY){hist[e.id]=e;renderHistory()} // outside the live window: keep a local copy
  }else{entries=entries.filter(x=>x.id!==e.id).concat(e);save('nt_entries',entries);render()}
}
function removeEntry(id){
  if(db){fam().collection('entries').doc(id).delete();delete hist[id];renderHistory()}
  else{entries=entries.filter(x=>x.id!==id);save('nt_entries',entries);render()}
}
function connect(){
  unsubs.forEach(f=>f());unsubs=[];db=null;
  if(typeof firebase==='undefined'||!FIREBASE_CONFIG||!family){$('#sync').textContent='· local only';return render()}
  if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
    try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch{}
  }
  db=firebase.firestore();
  unsubs.push(fam().onSnapshot(d=>{const s=d.data()&&d.data().settings;if(s){settings=s;save('nt_settings',s);initForm();render()}}));
  // only sync the last 14 days: all the plan and the 7-day averages need, and it keeps Firestore reads tiny
  unsubs.push(fam().collection('entries').where('start','>=',sod(Date.now())-14*DAY).onSnapshot(q=>{entries=q.docs.map(d=>d.data());save('nt_entries',entries);render()}));
  $('#sync').textContent='· shared';
}

// ---------- analysis ----------
const naps=()=>entries.filter(e=>e.type==='nap').sort((a,b)=>a.start-b.start);
const byDay=l=>{const m={};l.forEach(e=>(m[sod(e.start)]??=[]).push(e));return m};
const win7=()=>{const t=sod(Date.now());return[t-7*DAY,t]};

// average start + length of the n-th nap of the day over the past 7 days
function suggest(n){
  const[f,t]=win7(),m=byDay(naps().filter(e=>e.end)),xs=[];
  for(const d in m)if(+d>=f&&+d<t&&m[d][n-1])xs.push(m[d][n-1]);
  return xs.length?{start:avg(xs.map(e=>tod(e.start))),len:avg(xs.map(e=>(e.end-e.start)/6e4)),n:xs.length}:null;
}
function wakeEst(){
  const today=sod(Date.now()),tn=entries.find(e=>e.type==='night'&&e.end&&e.end>=today);
  if(tn)return tod(tn.end);
  const[f]=win7(),xs=entries.filter(e=>e.type==='night'&&e.end&&e.end>=f&&e.end<today).map(e=>tod(e.end));
  return xs.length?avg(xs):null;
}
// average gap between last nap ending and night sleep starting
function bedGap(){
  const[f,t]=win7(),m=byDay(naps().filter(e=>e.end)),gs=[];
  entries.filter(e=>e.type==='night'&&e.start>=f&&e.start<t).forEach(n=>{
    const l=(m[sod(n.start)]||[]).slice(-1)[0];
    if(l&&n.start>l.end)gs.push((n.start-l.end)/6e4);
  });
  return gs.length?avg(gs):null;
}

// ---------- actions ----------
function startE(type){putEntry({id:uid(),type,start:Date.now(),end:null})}
function stopE(id){const e=entries.find(x=>x.id===id);if(e)putEntry({...e,end:Date.now()})}
let ed=null;
function openEdit(id){
  const e=findE(id);if(!e)return;
  ed={id,type:e.type,day:sod(e.start),wasOpen:!e.end};
  $('#dt').textContent=(e.type==='nap'?'Nap':'Night sleep')+' · '+isoDay(e.start).slice(5);
  $('#es').value=hm(tod(e.start));$('#ee').value=e.end?hm(tod(e.end)):'';
  $('#edel').style.display='';$('#dlg').showModal();
}
function openAdd(type,day){
  const t0=!day||day===sod(Date.now());day=day||sod(Date.now());
  ed={id:null,type,day,wasOpen:t0}; // only today's entry may stay open-ended (in progress)
  $('#dt').textContent=(type==='nap'?(t0?'Add extra nap':'Add nap'):'Log bedtime')+(t0?'':' · '+isoDay(day).slice(5));
  $('#es').value=type==='night'?settings.bedtime:'';$('#ee').value='';
  $('#edel').style.display='none';$('#dlg').showModal();
}

// ---------- rendering ----------
function render(){
  const run=entries.find(e=>!e.end),nm=t=>t==='nap'?'Nap':'Night sleep';
  if(run){
    $('#now').innerHTML=`<h2>${nm(run.type)} in progress</h2><div class="big">${dur((Date.now()-run.start)/6e4)}</div><div class="mu">since ${hm(tod(run.start))}</div><p><button onclick="stopE('${run.id}')">End ${run.type==='nap'?'nap':'night sleep'}</button></p>`;
  }else{
    const last=entries.filter(e=>e.end).sort((a,b)=>b.end-a.end)[0];
    $('#now').innerHTML=`<h2>Awake</h2>${last?`<div class="big">${dur((Date.now()-last.end)/6e4)}</div><div class="mu">since ${hm(tod(last.end))}</div>`:'<div class="mu">No entries yet</div>'}<p><button onclick="startE('nap')">Start nap</button> <button onclick="startE('night')">Start night</button></p>`;
  }

  // plan: wake-up -> naps (actual or suggested) -> bedtime
  const today=sod(Date.now()),tn=naps().filter(e=>sod(e.start)===today),N=Math.max(+settings.targetNaps||0,tn.length);
  const we=entries.find(e=>e.type==='night'&&e.end&&e.end>=today);
  let prev=wakeEst(),h='';
  if(prev!=null)h+=we?`<div class="row tap" onclick="openEdit('${we.id}')"><span><b class="ok">✓</b> Wake-up</span><span class="mu">${hm(prev)} ›</span></div>`:`<div class="row"><span>Wake-up</span><span class="mu">~${hm(prev)}</span></div>`;
  for(let n=1;n<=N;n++){
    const a=tn[n-1];let s,e,tag;
    if(a){s=tod(a.start);e=a.end?tod(a.end):null;tag='<b class="ok">✓</b> '}
    else{
      const g=suggest(n);
      if(!g){h+=`<div class="row"><span>Nap ${n}</span><span class="mu">no data yet</span></div>`;prev=null;continue}
      s=g.start;e=g.start+g.len;tag='';
    }
    const aw=prev!=null&&s>prev?` · awake ${dur(s-prev)}`:'';
    h+=`<div class="row${a?' tap':''}"${a?` onclick="openEdit('${a.id}')"`:''}><span>${tag}Nap ${n}</span><span class="mu">${a?'':'~'}${hm(s)}–${e!=null?hm(e)+' ('+dur(e-s)+')':'now'}${aw}${a?' ›':''}</span></div>`;
    prev=e;
  }
  const g=bedGap(),est=prev!=null&&g!=null?prev+g:null,bn=entries.find(e=>e.type==='night'&&sod(e.start)===today);
  if(bn)h+=`<div class="row tap" onclick="openEdit('${bn.id}')"><span><b class="ok">✓</b> Bedtime</span><span class="mu">${hm(tod(bn.start))} · target ${settings.bedtime} ›</span></div>`;
  else h+=`<div class="row tap" onclick="openAdd('night')"><span>Bedtime</span><span class="mu">${est!=null?'~'+hm(est)+' · ':''}target ${settings.bedtime}${est!=null?' · awake '+dur(g):''} ›</span></div>`;
  h+=`<div class="mu" style="margin-top:6px">~ = average of the past 7 days · tap a row to edit</div>`;
  $('#plan').innerHTML=h;

  renderHistory();
}

// ---------- history tab ----------
const loadedM=new Set();
function setTab(t){
  tab=t;
  $('#v-today').hidden=t!=='today';$('#v-hist').hidden=t!=='hist';
  $('#t-today').classList.toggle('on',t==='today');$('#t-hist').classList.toggle('on',t==='hist');
  if(t==='hist'){ensureMonth();renderHistory()}
  window.scrollTo(0,0);
}
// shared mode: fetch the part of the viewed month that is older than the live sync window (once per month)
function ensureMonth(){
  if(!db)return;
  const from=+viewM,to=+new Date(viewM.getFullYear(),viewM.getMonth()+1,1),upto=Math.min(to,sod(Date.now())-14*DAY);
  if(upto<=from||loadedM.has(from))return;
  loadedM.add(from);
  fam().collection('entries').where('start','>=',from-DAY).where('start','<',upto).get()
    .then(q=>{q.docs.forEach(d=>hist[d.id]=d.data());renderHistory()})
    .catch(()=>loadedM.delete(from));
}
function showMonth(y,m){
  viewM=new Date(y,m,1);
  const n=new Date();
  selDay=viewM.getFullYear()===n.getFullYear()&&viewM.getMonth()===n.getMonth()?sod(Date.now()):+viewM;
  ensureMonth();renderHistory();
}
function pickDay(t){selDay=t;renderHistory()}
function renderHistory(){
  if(tab!=='hist')return;
  const y=viewM.getFullYear(),m=viewM.getMonth(),lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),all=allE(),has=new Set(),today=sod(Date.now()),now=new Date();
  all.forEach(e=>{has.add(sod(e.start));if(e.type==='night'&&e.end)has.add(sod(e.end))});
  let c=['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<div class="h">${x}</div>`).join('')+'<span></span>'.repeat(lead);
  for(let d=1;d<=dim;d++){
    const t=+new Date(y,m,d);
    c+=`<button class="${[t===selDay?'sel':'',t===today?'today':'',has.has(t)?'dot':''].join(' ')}" onclick="pickDay(${t})">${d}</button>`;
  }
  $('#cal').innerHTML=`<div class="calhead"><button class="x" onclick="showMonth(${y},${m-1})">‹</button><b>${viewM.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="x" onclick="showMonth(${y},${m+1})">›</button></div><div class="cal">${c}</div><button class="lnk" onclick="showMonth(${now.getFullYear()},${now.getMonth()})">Today</button>`;

  // selected day: wake-up (night that ended this day), naps, bedtime (night that started this day)
  const d=selDay,
    ns=all.filter(e=>e.type==='nap'&&sod(e.start)===d).sort((a,b)=>a.start-b.start),
    wk=all.find(e=>e.type==='night'&&e.end&&sod(e.end)===d),
    bd=all.find(e=>e.type==='night'&&sod(e.start)===d),
    row=(id,l,r)=>`<div class="row tap" onclick="openEdit('${id}')"><span>${l}</span><span class="mu">${r} ›</span></div>`;
  let h='';
  if(wk)h+=row(wk.id,'Wake-up',hm(tod(wk.end))+' · slept '+dur((wk.end-wk.start)/6e4));
  ns.forEach((e,i)=>h+=row(e.id,'Nap '+(i+1),hm(tod(e.start))+'–'+(e.end?hm(tod(e.end))+' ('+dur((e.end-e.start)/6e4)+')':'ongoing')));
  if(bd)h+=row(bd.id,'Bedtime',hm(tod(bd.start))+(bd.end?'':' · sleeping'));
  if(!h)h='<div class="mu">Nothing logged for this day</div>';
  else if(ns.length)h+=`<div class="mu" style="margin-top:6px">${ns.length} nap${ns.length>1?'s':''} · ${dur(ns.filter(e=>e.end).reduce((s,e)=>s+(e.end-e.start)/6e4,0))} total</div>`;
  h+=`<button class="lnk" onclick="openAdd('nap',${d})">＋ Add nap</button>`+(bd?'':`<button class="lnk" onclick="openAdd('night',${d})">＋ Log bedtime</button>`);
  $('#day').innerHTML=`<h2>${new Date(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</h2>`+h;
}

function initForm(){
  $('#sn').value=settings.targetNaps;$('#sb').value=settings.bedtime;$('#sf').value=family;
}
const atTime=(day,v)=>{const[h,m]=v.split(':').map(Number);const d=new Date(day);d.setHours(h,m,0,0);return +d};
$('#esave').onclick=()=>{
  const sv=$('#es').value,ev=$('#ee').value;
  if(!sv)return alert('Set a start time');
  const st=atTime(ed.day,sv);let en=null;
  if(ev){en=atTime(ed.day,ev);if(en<=st)en+=DAY} // e.g. night sleep crossing midnight
  else if(!ed.wasOpen)return alert('Set an end time, or delete the entry');
  const old=ed.id&&findE(ed.id);
  putEntry({...(old||{}),id:ed.id||uid(),type:ed.type,start:st,end:en});
  $('#dlg').close();
};
$('#ecancel').onclick=()=>$('#dlg').close();
$('#edel').onclick=()=>{if(confirm('Delete this entry?')){removeEntry(ed.id);$('#dlg').close()}};
$('#ssave').onclick=()=>{
  settings={targetNaps:+$('#sn').value||4,bedtime:$('#sb').value||'19:30'};
  save('nt_settings',settings);
  const f=$('#sf').value.trim();
  if(f!==family){family=f;save('nt_family',f);connect()}
  if(db)fam().set({settings},{merge:true});
  render();
};

initForm();connect();render();setInterval(render,30000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
